# ==========================================================
#  cf-vless 默认配置
#  本文件里都是公开信息（域名/端口/UUID/路径本来就不敏感），
#  可以直接放在公开仓库。install.sh 启动时会先拉取并读取它，
#  所以你执行安装时只需要传一个口令即可。
#  命令行参数优先级高于本文件，临时需要覆盖再传参。
# ==========================================================

# 【必填】Cloudflare 托管的域名。
# CF 后台那条 DNS 记录（橙云 Proxied）要指向本机的公网 IP / IPv6。
DOMAIN="4xui.mashen.de5.net"

# 【容器内监听端口】sing-box 在本机监听的端口，CF 回源会连到这个端口。
LISTEN_PORT="443"

# 【NAT 对外端口】小机/NAT 容器，提供商映射到公网的端口。
# 非 NAT 机器保持与 LISTEN_PORT 相同即可。
# 如果两者不同（例如公网 12345 -> 容器 443），
# 必须去 CF 后台加一条 Origin Rules 把目标端口改写成这个值，否则回源不通。
PUBLIC_PORT="443"

# VLESS 用户 UUID。留空则安装时自动随机生成。
UUID="7baef244-2761-4120-a878-5fca8b3179b6"

# WebSocket 路径。留空则安装时自动随机生成。
WS_PATH="/87605861"

# sing-box core 版本。二进制固定版本、从本仓库 bin/ 目录取，安装时不访问第三方源。
# 留空 = 用下面的 FALLBACK_CORE_VERSION。要升级时：把新版本 tar.gz 传进 bin/，
# 再把这个值改成对应版本即可（仓库里 bin/ 的文件名必须是
# sing-box-<版本>-linux-amd64.tar.gz 和 sing-box-<版本>-linux-arm64.tar.gz）。
# 注意：官方这种包是 glibc 动态链接版，Alpine(musl) 机器上还需要额外放
# sing-box-<版本>-linux-<架构>-musl.tar.gz，脚本会自动改用 musl 那份。
CORE_VERSION=""

# 上面留空时用的版本，同时也是默认值。
FALLBACK_CORE_VERSION="1.14.3"

# 防火墙：1 = 安装时放行端口；0 = 不动防火墙。
FIREWALL="1"

# 要放行的端口（Cloudflare 代理可用的全部端口，TCP）。
FIREWALL_PORTS="80 8080 8880 2052 2082 2086 2095 443 2053 2083 2087 2096 8443"

# ==========================================================
#  链路B：再套一层 Cloudflare 出口（WARP / WireGuard）
#  出口 IP 会变成 Cloudflare 的 IP（慢一点，但 IP 干净些）。
#  没套的那条就是链路A，直连、最快。
# ==========================================================

# 1 = 安装时额外生成链路B；0 = 只做链路A。
ENABLE_WARP="1"

# 【容器内监听端口】链路B 在本机监听的端口。
# 必须是 Cloudflare 支持的 HTTPS 端口之一：443 2053 2083 2087 2096 8443
WARP_PORT="8443"

# 【NAT 对外端口】链路B 在公网上暴露的端口。
# CF 按访客端口回源，所以客户端链接里写的就是这个端口。
# 非 NAT 机器（独服/VPS）与 WARP_PORT 保持一致即可；
# NAT 小机需要自己在面板上多加一条映射：外网 WARP_PUBLIC_PORT -> 内网 WARP_PORT。
WARP_PUBLIC_PORT="8443"

# 链路B 出站的 MTU。小内存机器建议 1280（更省内存也更稳）。
WARP_MTU="1280"

# WARP 入口（CF 官方端点），一般不用改。
# 如果这个域名在你这解析不通，可以改成 IP，例如 162.159.192.1:2408
WARP_ENDPOINT="engage.cloudflareclient.com:2408"

# 仓库原始文件地址（换仓库或换分支时改这里）。
REPO_RAW="https://raw.githubusercontent.com/spverk/huangkingking/main"
